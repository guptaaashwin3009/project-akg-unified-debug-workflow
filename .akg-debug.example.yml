service: payments-api
datadog:
  query: service:payments-api env:prod
# Optional. Omit this section to investigate with Datadog and Kubernetes only.
# The LogQL query is sent as written. Include an error filter here.
grafana:
  datasourceUid: loki
  query: '{app="payments-api"} |= "error"'
k8s:
  namespace: payments
  selector: app=payments-api
github:
  deployWorkflow: deploy.yml
  # Optional. Omit to deploy the pull request head branch.
  deployRef: main
  # Optional inputs passed as `gh workflow run -f key=value`.
  workflowInputs:
    environment: prod
patch:
  # Optional. When omitted, any repo file is allowed except .git, absolute paths, and `..`.
  allow:
    - "src/**"
    - "test/**"
